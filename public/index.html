<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trivia Twitch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Trivia Twitch</h1>
  <div id="pregunta"></div>
  <div id="opciones"></div>
  <h2>Jugadores activos:</h2>
  <div id="jugadores"></div>

  <script>
    async function actualizar() {
      const res = await fetch("/estado");
      const data = await res.json();

      document.getElementById("pregunta").innerText = data.pregunta;
      document.getElementById("opciones").innerText = data.opciones.join(" | ");
      document.getElementById("jugadores").innerText = data.jugadores.join(", ");
    }

    setInterval(actualizar, 3000); // refresca cada 3 segundos
  </script>
</body>
</html>
